<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Movix · Live TV</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="/styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%BA%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <div class="brand">
          <span class="brand-logo">▶</span>
          <span class="brand-name">Movix<span>LiveTV</span></span>
        </div>
        <nav id="catalogs" aria-label="Catégories"></nav>
        <div class="sidebar-foot">
          <span id="status-dot" class="dot"></span>
          <span id="status-text">Connexion…</span>
        </div>
      </aside>

      <main id="main">
        <header id="topbar">
          <button id="menu-toggle" class="icon-btn" aria-label="Menu">☰</button>
          <h1 id="catalog-title">Live TV</h1>
          <div class="search-wrap">
            <input
              id="search"
              type="search"
              placeholder="Rechercher une chaîne…"
              autocomplete="off"
            />
          </div>
        </header>

        <section id="player-section" class="hidden">
          <div class="player-shell">
            <video id="video" controls playsinline></video>
            <div id="player-overlay" class="player-overlay hidden">
              <div class="spinner"></div>
              <p id="player-message">Chargement du flux…</p>
            </div>
          </div>
          <div class="player-meta">
            <div>
              <h2 id="now-playing">—</h2>
              <p id="now-playing-sub" class="muted"></p>
            </div>
            <div id="source-switch" class="source-switch"></div>
            <button id="close-player" class="ghost-btn">Fermer</button>
          </div>
        </section>

        <section id="grid-section">
          <div id="grid" class="grid"></div>
          <div id="grid-empty" class="empty hidden">
            <p>Sélectionne une catégorie pour afficher les chaînes.</p>
          </div>
          <div id="grid-loading" class="empty hidden">
            <div class="spinner"></div>
            <p>Chargement des chaînes…</p>
          </div>
        </section>
      </main>
    </div>

    <div id="toast" class="toast hidden"></div>

    <script src="/vendor/hls.min.js"></script>
    <script src="/app.js" type="module"></script>
  </body>
</html>
